<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E234A"/>
      <stop offset="100%" stop-color="#080B17"/>
    </radialGradient>

    <!-- Coral Heart Gradient -->
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E7D"/>
      <stop offset="100%" stop-color="#FF5E96"/>
    </linearGradient>

    <!-- Lime Heart Gradient -->
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2FF7D"/>
      <stop offset="100%" stop-color="#9EFF3B"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="100" height="100" rx="28" fill="url(#bgGlow)"/>
  <rect width="96" height="96" x="2" y="2" rx="26" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Outer Vinyl Groove Ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(200, 255, 79, 0.15)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <g filter="url(#glowFilter)">
    <!-- Left Heart (Person 1 - Coral) -->
    <path d="M 38,28 C 30,20 18,26 18,36 C 18,48 38,62 38,62 C 38,62 44,57.5 48.5,52.5 C 44,46 42,38 42,32 C 42,29.5 43,27 44.5,25 C 42.5,23 39.8,22.5 38,28 Z" 
          fill="url(#coralGrad)" 
          opacity="0.95"/>

    <!-- Right Heart (Person 2 - Lime) -->
    <path d="M 62,28 C 70,20 82,26 82,36 C 82,48 62,62 62,62 C 62,62 56,57.5 51.5,52.5 C 56,46 58,38 58,32 C 58,29.5 57,27 55.5,25 C 57.5,23 60.2,22.5 62,28 Z" 
          fill="url(#limeGrad)" 
          opacity="0.95"/>

    <!-- Center Intersecting Synced Heart Pulse Core -->
    <path d="M 50,30 C 45,24 37,28 37,35 C 37,45 50,56 50,56 C 50,56 63,45 63,35 C 63,28 55,24 50,30 Z" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="2.5" 
          stroke-linejoin="round"/>

    <!-- Center Musical Pulse Node -->
    <circle cx="50" cy="38" r="3" fill="#FFFFFF"/>
    <path d="M 50,38 L 50,30 L 55,32" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
</svg>